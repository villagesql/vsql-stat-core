name: test
on: [pull_request, workflow_dispatch]

# vsql-stat-core is a plain C++ source library (compiled into the sink
# extensions), not a VEB extension -- so it does NOT use the
# villagesql/extension-actions/cpp action. Its CI just builds and runs the
# standalone unit test (no VillageSQL server or SDK needed).
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install build tools
        run: sudo apt-get install -y --no-install-recommends cmake g++ make
      - name: Build and run unit tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel "$(nproc)"
          ctest --test-dir build --output-on-failure
